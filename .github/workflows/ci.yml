name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install Compact toolchain 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: compact update 0.31.1
      - run: npm ci
      - name: Compile contracts (type-check only)
        run: node scripts/compact.mjs --skip-zk
      - run: npm test
      - run: npm run attack
      # The web app is deployed from this code, so it must type-check and bundle.
      # (Proving keys are not built here; the app fetches them at runtime.)
      - name: Type-check and build the web app
        working-directory: app
        run: npx tsc --noEmit -p . && npx vite build
