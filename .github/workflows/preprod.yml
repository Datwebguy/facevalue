# Deploys FaceValue to Midnight Preprod, runs the full lifecycle with real proofs,
# and commits the evidence plus the app's deployment config. Run manually.
#
# No secrets: each run creates a throwaway testnet wallet, funds it from the free
# Preprod faucet, and discards it. The web app is deployed separately (vercel CLI).
name: Preprod deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install Compact toolchain 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: compact update 0.31.1
      - run: npm ci
      - name: Compile contracts with proving keys
        run: node scripts/compact.mjs
      - name: Start proof server
        run: |
          docker run -d --name proof-server -p 6300:6300 midnightntwrk/proof-server:8.0.3 midnight-proof-server -v
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:6300/ && docker logs proof-server 2>&1 | grep -q "listening on" && break; sleep 5; done
      - name: Full lifecycle on Preprod (real proofs)
        env:
          LOG_LEVEL: info
        run: npx tsx cli/src/e2e.ts preprod
      - name: Commit evidence
        run: |
          git config user.name Datwebguy
          git config user.email Datwebguy@users.noreply.github.com
          node scripts/deployment-from-evidence.mjs preprod
          git add docs/evidence/preprod-run.json app/src/deployment.ts
          git commit -m "Preprod deployment evidence" || true
          git push
